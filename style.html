<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YouTube Navbar Clone</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  
  <div class="navbar">
    
    <div class="left-section">
      <i class="fas fa-bars"></i>
      <div class="youtube-logo">
  <img src="https://upload.wikimedia.org/wikipedia/commons/4/42/YouTube_icon_%282013-2017%29.png" alt="YouTube Logo" height="40" width="40">
  <span style="color: white; font-size: 22px; font-weight: bold; margin-left: 5px;">YouTube</span>
  <span style="font-size: 12px; color: lightgray; margin-left: 2px;">IN</span>
</div>

    </div>

    
    <div class="search-bar">
      <input type="text" placeholder="Search">
      <button><i class="fas fa-search"></i></button>
      <div class="mic-icon">
        <i class="fas fa-microphone"></i>
      </div>
    </div>

    
    <div class="right-section">
      <div class="icon-btn">
        <p><i class="fas fa-plus"></i> Create</p>
      </div>
      <div class="icon-btn">
        <i class="fas fa-bell"></i>
        <span class="notification-dot">1</span>
      </div>
      <div class="profile">
        <img src="profile.png" alt="muruga" width="20px"height="20px">
      </div>
    </div>
  </div>
  <div class="layout">

  
    <div class="sidebar">
      <div class="sidebar-item"><p><i class="fas fa-home"></i>Home</p></div>
      <div class="sidebar-item"><p><i class="fas fa-bolt"></i>Shorts</p></div>
      <div class="sidebar-item"><p><i class="fas fa-tv"></i>Subscriptions</p></div>
      <div class="sidebar-item"><p><i class="fas fa-user"></i>YOU</p></div>
      <div class="sidebar-item"><p><i class="fas fa-book"></i>Library</p></div>
    </div>
  </div>

  <div class="main-content">
  <div class="categories">
    <div class="category active">All</div>
    <div class="category">Music</div>
    <div class="category">Gaming</div>
    <div class="category">Live</div>
    <div class="category">Tamil Cinema</div>
    <div class="category">Free Fire MAX</div>
    <div class="category">Mixes</div>
    <div class="category">A. R. Rahman</div>
    <div class="category">HTML</div>
    <div class="category">Object-oriented programming</div>
    <div class="category">React routers</div>
    <div class="category">Finals</div>
  </div>
  </div>

</body>
</html>
